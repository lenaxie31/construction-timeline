<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤管理 — 施工及監造回報</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ── 月份導覽 ── */
.month-nav { display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap; }
.month-nav-title { font-family:'DM Mono',monospace;font-size:20px;font-weight:700;color:var(--dnv-dark-blue);min-width:100px; }
.month-nav-btn { width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .12s; }
.month-nav-btn:hover { background:var(--border-light); }
/* ── 月曆 ── */
.att-cal-wrap { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px; }
.att-cal-header { display:grid;grid-template-columns:repeat(7,1fr);background:var(--dnv-dark-blue); }
.att-cal-dow { text-align:center;padding:8px 4px;font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px; }
.att-cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:0; }
.att-cal-cell { min-height:90px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:4px 5px;position:relative;cursor:pointer;transition:background .12s;overflow:hidden; }
.att-cal-cell:hover { background:var(--bg); }
.att-cal-cell.inactive { background:#F9F9F8;opacity:.5;cursor:default; }
.att-cal-cell.holiday  { background:#FFF8F0; }
.att-cal-cell.today    { background:#EAF3FB; }
.att-cal-cell.today .att-day-num { background:var(--dnv-dark-blue);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center; }
.att-day-num { font-size:12px;font-weight:700;color:var(--text-primary);line-height:1; }
.att-cal-cell.holiday .att-day-num { color:var(--c-red); }
.att-holiday-name { font-size:8px;color:var(--c-red);font-weight:600;margin-top:1px; }
.att-pip-wrap { display:flex;flex-direction:column;gap:2px;margin-top:3px; }
.att-pip { font-size:10px;font-weight:600;padding:2px 5px;border-radius:3px;white-space:nowrap;display:flex;align-items:center;gap:3px;line-height:1.3; }
.att-pip-name { font-weight:700;flex-shrink:0; }
.att-pip-role { font-weight:400;opacity:.7;font-size:9px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis; }
.pip-present { background:var(--c-green-bg);color:var(--c-green);border:1px solid var(--c-green-border); }
.pip-late    { background:var(--c-amber-bg);color:var(--c-amber);border:1px solid var(--c-amber-border); }
.pip-absent  { background:var(--c-red-bg);color:var(--c-red);border:1px solid var(--c-red-border); }
.pip-leave   { background:#F5F3FF;color:#6d28d9;border:1px solid #ddd6fe; }
.pip-holiday { background:#F0F9FF;color:var(--dnv-sea-blue);border:1px solid var(--c-blue-border); }
/* ── 月報摘要 ── */
.att-summary-wrap { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px;overflow-x:auto; }
.att-summary-table { width:100%;border-collapse:collapse;font-size:12px;min-width:700px; }
.att-summary-table th { background:var(--dnv-dark-blue);color:#fff;padding:9px 12px;text-align:left;font-size:11px;font-weight:700;white-space:nowrap; }
.att-summary-table td { padding:9px 12px;border-bottom:1px solid var(--border-light);vertical-align:middle; }
.att-summary-table tr:last-child td { border-bottom:none; }
.att-summary-table tr:hover td { background:var(--bg); }
.att-bar { height:8px;background:var(--border-light);border-radius:4px;overflow:hidden;width:80px; }
.att-bar-fill { height:100%;border-radius:4px;background:linear-gradient(90deg,#16a34a,#4ade80); }
.att-rate-badge { font-family:'DM Mono',monospace;font-size:12px;font-weight:600; }
.att-rate-good { color:var(--c-green); }
.att-rate-warn { color:var(--c-amber); }
.att-rate-bad  { color:var(--c-red); }
/* ── 出勤 Modal ── */
.att-modal-date { font-family:'DM Mono',monospace;font-size:14px;font-weight:700;padding:8px 12px;background:var(--dnv-dark-blue);color:#fff;border-radius:6px;margin-bottom:4px;display:inline-block; }
.att-member-row { display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light); }
.att-member-row:last-child { border-bottom:none; }
.att-member-name { font-size:13px;font-weight:600;width:72px;flex-shrink:0; }
.att-status-sel { font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none;cursor:pointer;flex-shrink:0; }
.att-time-input { font-family:'DM Mono',monospace;font-size:12px;width:72px;padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none;text-align:center; }
.att-time-label { font-size:10px;color:var(--text-muted);white-space:nowrap; }
/* ── 人員管理 Modal ── */
.member-chip { display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:13px; }
.member-chip-name { flex:1;font-weight:600; }
.member-chip-role { font-size:11px;color:var(--text-muted); }
/* XLS 匯入提示 */
.xls-hint { font-size:11px;color:var(--text-muted);line-height:1.7;background:var(--bg);padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-light); }
@media(max-width:767px) {
  .att-cal-cell { min-height:44px;padding:2px; }
  .att-pip { font-size:8px;padding:1px 3px; }
  .att-pip-role { display:none; }
  .att-cal-cell.today .att-day-num { width:18px;height:18px;font-size:10px; }
  .att-day-num { font-size:10px; }
}
</style>
</head>
<body>
<div id="header-mount"></div>
<div class="layout">
  <div class="sidebar collapsed" id="sidebar">
    <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" id="collapse-icon"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-inner">
      <div class="sidebar-section-title">工具</div>
      <button class="btn-secondary" onclick="openMemberModal()">👷 管理人員</button>
      <button class="btn-secondary" onclick="openHolidayModal()">📅 行事曆設定</button>
      <div class="sidebar-section-title" style="margin-top:12px;">XLS 匯入</div>
      <label style="display:block;">
        <input type="file" id="xls-file" accept=".xls,.xlsx" style="display:none;" onchange="importPunchXLS(this)">
        <button class="btn-secondary" onclick="document.getElementById('xls-file').click()">⬆ 匯入排班表 XLS</button>
      </label>
      <div class="xls-hint">支援人員排班表格式<br>自動跳過週六日與國定假日</div>
      <div class="sidebar-section-title" style="margin-top:12px;">資料修復</div>
      <button class="btn-secondary" onclick="purgeMonthRecords()"
        style="font-size:11px;color:var(--c-red);border-color:var(--c-red-border);">🗑 清除本月全部出勤記錄</button>
      <div style="font-size:10px;color:var(--text-muted);line-height:1.6;padding:2px 0 6px;">清除後可重新匯入 Excel</div>
      <button class="btn-secondary" onclick="fixOrphanRecords()"
        style="font-size:11px;color:var(--c-blue);border-color:var(--c-blue-border);">🔧 修復孤兒出勤記錄</button>
      <div style="font-size:10px;color:var(--text-muted);line-height:1.6;padding:2px 0 6px;">修正 memberId 不一致問題</div>
      <button class="btn-secondary" onclick="purgeHolidayRecords()"
        style="font-size:11px;color:var(--c-amber);border-color:var(--c-amber-border);">🗑 清除假日錯誤記錄</button>
      <div style="font-size:10px;color:var(--text-muted);line-height:1.6;padding:2px 0;">移除週六日/假日的 XLS 匯入出勤記錄</div>
    </div>
  </div>
  <div class="main">
    <div class="tab-panel">
      <!-- 月份導覽 -->
      <div class="month-nav">
        <button class="month-nav-btn" onclick="changeMonth(-1)">◀</button>
        <span class="month-nav-title" id="month-title"></span>
        <button class="month-nav-btn" onclick="changeMonth(1)">▶</button>
        <button class="btn-secondary" style="width:auto;padding:6px 14px;font-size:12px;" onclick="goToday()">本月</button>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <span class="sync-badge" style="background:var(--c-green-bg);color:var(--c-green);border:1px solid var(--c-green-border);">出勤 <span id="att-present-cnt">0</span></span>
          <span class="sync-badge" style="background:var(--c-amber-bg);color:var(--c-amber);border:1px solid var(--c-amber-border);">遲到 <span id="att-late-cnt">0</span></span>
          <span class="sync-badge" style="background:var(--c-red-bg);color:var(--c-red);border:1px solid var(--c-red-border);">缺勤 <span id="att-absent-cnt">0</span></span>
        </div>
      </div>

      <!-- 月曆 -->
      <div class="att-cal-wrap">
        <div class="att-cal-header">
          <div class="att-cal-dow">日</div><div class="att-cal-dow">一</div><div class="att-cal-dow">二</div>
          <div class="att-cal-dow">三</div><div class="att-cal-dow">四</div><div class="att-cal-dow">五</div>
          <div class="att-cal-dow" style="color:rgba(255,180,180,.9);">六</div>
        </div>
        <div class="att-cal-grid" id="att-cal-grid"></div>
      </div>

      <!-- 月報摘要 -->
      <div class="att-summary-wrap">
        <table class="att-summary-table">
          <thead><tr>
            <th>人員</th><th>職稱</th><th>應出勤</th>
            <th>實出勤</th><th>遲到</th><th>缺勤</th><th>請假</th>
            <th>出勤率</th><th>出勤率圖</th><th>總工時</th>
          </tr></thead>
          <tbody id="att-summary-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="dnv-brand-footer">DNV AS　減碳A標施工監造回報系統</div>

<!-- 出勤記錄 Modal -->
<div class="modal-overlay" id="att-modal" style="display:none">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <div>
        <div class="att-modal-date" id="att-modal-date-label">—</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">點選人員狀態進行記錄，即時儲存</div>
      </div>
      <button class="modal-close" onclick="closeAttModal()">×</button>
    </div>
    <div class="modal-body" id="att-modal-body" style="max-height:70vh;overflow-y:auto;padding:12px 16px;"></div>
    <div class="modal-footer">
      <button class="btn-modal" onclick="closeAttModal()">關閉</button>
      <button class="btn-modal primary" onclick="saveAttDay()">儲存</button>
    </div>
  </div>
</div>

<!-- 人員管理 Modal -->
<div class="modal-overlay" id="member-modal" style="display:none">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header"><h3>👷 人員管理</h3><button class="modal-close" onclick="document.getElementById('member-modal').style.display='none'">×</button></div>
    <div class="modal-body">
      <div id="member-list"></div>
      <div style="border-top:1px solid var(--border-light);padding-top:12px;margin-top:4px;">
        <div style="font-size:12px;font-weight:700;margin-bottom:8px;">新增人員</div>
        <div class="field-row">
          <div class="field"><label>姓名</label><input type="text" id="new-member-name" placeholder="姓名"></div>
          <div class="field"><label>職稱</label><input type="text" id="new-member-role" placeholder="例：監造工程師"></div>
        </div>
        <button class="btn-primary" style="margin-top:8px;" onclick="addMember()">新增人員</button>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-modal primary" onclick="saveMembersAndClose()">儲存</button></div>
  </div>
</div>

<!-- 行事曆設定 Modal -->
<div class="modal-overlay" id="holiday-modal" style="display:none">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header"><h3>📅 行事曆設定</h3><button class="modal-close" onclick="document.getElementById('holiday-modal').style.display='none'">×</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">設定特定日期為假日或補班日（優先於台灣國定假日）</div>
      <div class="field">
        <label>新增假日</label>
        <div style="display:flex;gap:6px;">
          <input type="date" id="holiday-add-date" style="flex:1;font-family:inherit;font-size:13px;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none;">
          <input type="text" id="holiday-add-name" placeholder="假日名稱" style="flex:1;font-family:inherit;font-size:13px;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none;">
          <button class="btn-secondary" style="width:auto;padding:7px 12px;" onclick="addHolidayEntry()">加入</button>
        </div>
      </div>
      <div class="field" style="margin-top:4px;">
        <label>新增補班日（週六補班）</label>
        <div style="display:flex;gap:6px;">
          <input type="date" id="workday-add-date" style="flex:1;font-family:inherit;font-size:13px;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none;">
          <button class="btn-secondary" style="width:auto;padding:7px 12px;" onclick="addWorkdayEntry()">設為工作日</button>
        </div>
      </div>
      <div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">自訂假日清單</div>
      <div id="custom-holiday-list" style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal" onclick="document.getElementById('holiday-modal').style.display='none'">取消</button>
      <button class="btn-modal primary" onclick="saveHolidaysAndClose()">儲存</button>
    </div>
  </div>
</div>

<div class="toast-confirm" id="toast-confirm">
  <span id="toast-msg">確定要刪除？</span>
  <div style="display:flex;gap:8px;">
    <button class="toast-btn-cancel" onclick="toastResolve(false)">取消</button>
    <button class="toast-btn-ok" id="toast-ok-btn" onclick="toastResolve(true)">刪除</button>
  </div>
</div>

<script src="shared.js"></script>
<script>
'use strict';
if (!requireAuth()) throw new Error('not auth');

// ── 狀態 ──
let curYear, curMonth; // 1-based month
let attRecords = []; // { id, date, memberId, status, timeIn, timeOut, note }
let members    = [];
let holidayData = { holidays:{}, workdays:{} };

const ATT_STATUS = { present:'出勤', late:'遲到', absent:'缺勤', leave:'請假', holiday:'公假' };
const ATT_STATUS_PIP = { present:'pip-present', late:'pip-late', absent:'pip-absent', leave:'pip-leave', holiday:'pip-holiday' };

function attSave() {
  try { localStorage.setItem('construction_att_v1', JSON.stringify(attRecords)); } catch(e) {}
  setTimeout(()=>cloudSaveAll('att',attRecords).catch(()=>{}), 500);
}
function membersSave() {
  try { localStorage.setItem('construction_members_v1', JSON.stringify(members)); } catch(e) {}
  setTimeout(()=>cloudSaveAll('members',members).catch(()=>{}), 500);
}

async function init() {
  document.getElementById('header-mount').innerHTML = buildHeader('出勤管理');
  initSidebarState();
  renderNav('attendance');

  const now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth() + 1;

  const data = await loadAllData();
  attRecords = data.attRecords;
  members    = data.members;
  holidayData = loadHolidays();

  renderAll();
}

function renderAll() {
  renderMonthTitle();
  renderCalendar();
  renderSummary();
  updateHeaderBadges();
}

function renderMonthTitle() {
  document.getElementById('month-title').textContent = curYear + '年 ' + String(curMonth).padStart(2,'0') + '月';
}

function changeMonth(delta) {
  curMonth += delta;
  if (curMonth > 12) { curMonth = 1; curYear++; }
  if (curMonth < 1)  { curMonth = 12; curYear--; }
  renderAll();
}
function goToday() {
  const now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth() + 1;
  renderAll();
}

function renderCalendar() {
  const grid   = document.getElementById('att-cal-grid'); if (!grid) return;
  const today  = todayStr();
  const y = curYear, mo = curMonth;
  const firstDay = new Date(y, mo-1, 1).getDay();
  const daysInMonth = new Date(y, mo, 0).getDate();
  const hols   = holidayData.holidays || TW_HOLIDAYS_DEFAULT;
  const works  = holidayData.workdays || {};

  let html = '';
  // blank cells before first day
  for (let i = 0; i < firstDay; i++) html += '<div class="att-cal-cell inactive"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const isToday  = dateStr === today;
    const isHoliday= isHolidayDate(dateStr, hols, works);
    const holName  = hols[dateStr] || '';
    const dow      = new Date(y, mo-1, d).getDay();
    const isSat    = dow === 6;

    // get records for this day — 只顯示有出勤記錄的人
    // 假日格子裡的 present 記錄（匯入錯誤殘留）一律隱藏
    const dayRecs = attRecords.filter(r => {
      if (r.date !== dateStr) return false;
      // 只過濾國定假日的 XLS present 殘留記錄；六日加班正常顯示
      if (hols[dateStr] && r.status === 'present' && r.note === 'XLS匯入') return false;
      return true;
    });
    const pips = dayRecs.map(r => {
      const m   = members.find(x => x.id === r.memberId);
      if (!m) return '';
      const cls  = ATT_STATUS_PIP[r.status] || 'pip-present';
      const role = m.role || '';
      return `<span class="att-pip ${cls}">
        <span class="att-pip-name">${esc(m.name)}</span>
        ${role ? `<span class="att-pip-role">${esc(role)}</span>` : ''}
      </span>`;
    }).join('');

    const cls = ['att-cal-cell', isToday?'today':'', isHoliday?'holiday':'', isSat&&!isHoliday?'sat':''].filter(Boolean).join(' ');
    html += `<div class="${cls}" data-date="${dateStr}" onclick="openAttModal('${dateStr}')">
      <div class="att-day-num">${d}</div>
      ${holName ? `<div class="att-holiday-name">${esc(holName)}</div>` : ''}
      <div class="att-pip-wrap">${pips}</div>
    </div>`;
  }

  // trailing blanks
  const totalCells = firstDay + daysInMonth;
  const trailing   = totalCells % 7 ? 7 - (totalCells % 7) : 0;
  for (let i = 0; i < trailing; i++) html += '<div class="att-cal-cell inactive"></div>';

  grid.innerHTML = html;
}

function renderSummary() {
  const tbody = document.getElementById('att-summary-tbody'); if (!tbody) return;
  const y = curYear, mo = curMonth;
  const hols  = holidayData.holidays || TW_HOLIDAYS_DEFAULT;
  const works = holidayData.workdays  || {};
  const wdays = calcWorkdays(y, mo, hols, works);
  const monthPrefix = y + '-' + String(mo).padStart(2,'0');

  const activeMembers = members.filter(m => m.active !== false);
  if (!activeMembers.length) { tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--text-muted);">尚無人員</td></tr>'; return; }

  tbody.innerHTML = activeMembers.map(m => {
    // 只過濾國定假日的 XLS present 記錄；六日加班正常計入
    const recs = attRecords.filter(r => {
      if (r.memberId !== m.id || !r.date.startsWith(monthPrefix)) return false;
      if (r.status === 'present' && r.note === 'XLS匯入' && hols[r.date]) return false;
      return true;
    });
    const present = recs.filter(r => r.status === 'present').length;
    const late    = recs.filter(r => r.status === 'late').length;
    const absent  = recs.filter(r => r.status === 'absent').length;
    const leave   = recs.filter(r => r.status === 'leave' || r.status === 'holiday').length;
    const actual  = present + late;
    // 出勤率上限 100%
    const rate    = wdays ? Math.min(100, Math.round(actual / wdays * 100)) : 0;
    const rateCls = rate >= 90 ? 'att-rate-good' : rate >= 70 ? 'att-rate-warn' : 'att-rate-bad';
    const totalMin= recs.reduce((sum, r) => sum + calcWorkMinutes(r.timeIn, r.timeOut), 0);
    return `<tr>
      <td style="font-weight:600;">${esc(m.name)}</td>
      <td style="font-size:11px;color:var(--text-muted);">${esc(m.role||'')}</td>
      <td style="font-family:monospace;">${wdays}</td>
      <td style="font-family:monospace;">${actual}</td>
      <td style="font-family:monospace;${late?'color:var(--c-amber);font-weight:700;':'color:var(--text-muted)'};">${late}</td>
      <td style="font-family:monospace;${absent?'color:var(--c-red);font-weight:700;':'color:var(--text-muted)'};">${absent}</td>
      <td style="font-family:monospace;color:var(--text-muted);">${leave}</td>
      <td><span class="att-rate-badge ${rateCls}">${rate}%</span></td>
      <td><div class="att-bar"><div class="att-bar-fill" style="width:${rate}%"></div></div></td>
      <td style="font-family:monospace;font-size:11px;color:var(--text-muted);">${fmtMinutes(totalMin)}</td>
    </tr>`;
  }).join('');
}

let attModalDate = '';
let attModalTmp  = {}; // memberId → { status, timeIn, timeOut, note }

function openAttModal(dateStr) {
  attModalDate = dateStr;
  attModalTmp  = {};

  // pre-fill from existing records
  members.filter(m=>m.active!==false).forEach(m => {
    const rec = attRecords.find(r => r.date === dateStr && r.memberId === m.id);
    attModalTmp[m.id] = rec
      ? { status: rec.status, timeIn: rec.timeIn||'', timeOut: rec.timeOut||'', note: rec.note||'' }
      : { status: '', timeIn: '', timeOut: '', note: '' };
  });

  document.getElementById('att-modal-date-label').textContent = dateStr;
  renderAttModalBody();
  document.getElementById('att-modal').style.display = 'flex';
}

function renderAttModalBody() {
  const body = document.getElementById('att-modal-body');
  const activeMembers = members.filter(m => m.active !== false);
  if (!activeMembers.length) { body.innerHTML = '<div class="empty">請先至「管理人員」設定監造人員</div>'; return; }

  body.innerHTML = activeMembers.map(m => {
    const tmp = attModalTmp[m.id] || { status:'', timeIn:'', timeOut:'', note:'' };
    const statusOpts = [
      { v:'',        l:'— 未記錄 —' },
      { v:'present', l:'✅ 出勤' },
      { v:'late',    l:'⏰ 遲到' },
      { v:'absent',  l:'❌ 缺勤' },
      { v:'leave',   l:'🏥 請假' },
      { v:'holiday', l:'📌 公假' },
    ];
    return `<div class="att-member-row">
      <div class="att-member-name">${esc(m.name)}</div>
      <select class="att-status-sel" data-mid="${m.id}" onchange="onAttStatusChange('${m.id}',this.value)">
        ${statusOpts.map(o=>`<option value="${o.v}"${tmp.status===o.v?' selected':''}>${o.l}</option>`).join('')}
      </select>
      <span class="att-time-label">到</span>
      <input type="time" class="att-time-input" data-mid="${m.id}" data-field="timeIn" value="${esc(tmp.timeIn)}" oninput="onAttTimeChange('${m.id}','timeIn',this.value)" placeholder="08:00">
      <span class="att-time-label">退</span>
      <input type="time" class="att-time-input" data-mid="${m.id}" data-field="timeOut" value="${esc(tmp.timeOut)}" oninput="onAttTimeChange('${m.id}','timeOut',this.value)" placeholder="17:00">
    </div>`;
  }).join('');
}

function onAttStatusChange(mid, val) { if (attModalTmp[mid]) attModalTmp[mid].status = val; }
function onAttTimeChange(mid, field, val) { if (attModalTmp[mid]) attModalTmp[mid][field] = val; }

function saveAttDay() {
  // remove existing records for this date
  attRecords = attRecords.filter(r => r.date !== attModalDate);

  Object.keys(attModalTmp).forEach(mid => {

    attRecords.push({ id: uid(), date: attModalDate, memberId: mid, status: tmp.status, timeIn: tmp.timeIn||'', timeOut: tmp.timeOut||'', note: tmp.note||'' });

// ── 修復孤兒出勤記錄（memberId 無對應人員）──
function fixOrphanRecords() {
  const memberIds = new Set(members.map(m => m.id));
  const orphans   = attRecords.filter(r => !memberIds.has(r.memberId));
  if (!orphans.length) { alert('沒有發現孤兒記錄，資料正常。'); return; }

  // 用時間記錄的 note 或其他方式無法知道名字，只能刪除孤兒
  // 但若孤兒有時間資料，嘗試用日期+時間找到最接近的人員記錄並合併
  const orphanIds = [...new Set(orphans.map(r => r.memberId))];
  let fixed = 0, removed = 0;

  orphanIds.forEach(orphanId => {
    const orphanRecs   = attRecords.filter(r => r.memberId === orphanId);
    const withTime     = orphanRecs.filter(r => r.timeIn);

    if (!withTime.length) {
      // 無時間的孤兒直接刪除
      attRecords = attRecords.filter(r => r.memberId !== orphanId);
      removed += orphanRecs.length;
      return;
    }

    // 有時間的孤兒：找系統人員中同月同日有記錄但無時間的那個，把時間搬過去
    withTime.forEach(orphanRec => {
      // 找同一天、有出勤但無時間的記錄
      const target = attRecords.find(r =>
        r.memberId !== orphanId &&
        r.date === orphanRec.date &&
        !r.timeIn &&
        memberIds.has(r.memberId)
      );
      if (target) {
        target.timeIn  = orphanRec.timeIn;
        target.timeOut = orphanRec.timeOut;
        target.note    = 'XLS匯入';
        fixed++;
      }
    });

    // 孤兒記錄全部刪除（已搬移或無法搬移）
    attRecords = attRecords.filter(r => r.memberId !== orphanId);
    removed   += orphanRecs.length;
  });

  attSave();
  cloudSaveAll('att', attRecords).catch(() => {});
  alert(`✅ 修復完成\n搬移時間：${fixed} 筆\n刪除孤兒：${removed} 筆\n\n如仍有問題，請用「清除本月記錄」後重新匯入。`);
  renderAll();
}

// ── XLS 打卡鐘匯入 ──
function importPunchXLS(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const XLSX = window.XLSX;
      if (!XLSX) { alert('XLSX 程式庫未載入，請重新整理頁面'); return; }

      const wb = XLSX.read(e.target.result, { type:'binary', cellDates:false });

      // ── 偵測工作表模式 ──
      // 有「考勤明細」相關工作表 → 打卡時間模式
      // 只有「人員排班表」→ 舊排班模式
      const detailSheets = wb.SheetNames.filter(n =>
        /^\d/.test(n) || n.includes('明細') || n.includes('記錄')
      ).filter(n => !['考勤記錄','異常統計表','考勤匯總表'].includes(n));
      const hasRanking = wb.SheetNames.includes('人員排班表');

      if (detailSheets.length > 0) {
        importFromDetailSheets(wb, detailSheets);
      } else if (hasRanking) {
        importFromRankingSheet(wb);
      } else {
        alert('無法辨識 Excel 格式\n請確認包含「人員排班表」或考勤明細工作表');
      }
    } catch(err) {
      alert('匯入失敗：' + err.message);
      console.error('[匯入]', err);
    }
    input.value = '';
  };
  reader.readAsBinaryString(file);
}

// ── 模式一：考勤明細表（含實際打卡時間）──
function importFromDetailSheets(wb, sheetNames) {
  const importHols = (loadHolidays().holidays) || TW_HOLIDAYS_DEFAULT;

  function parseTimeStr(val) {
    if (!val || val === '缺' || val === '') return '';
    const s = String(val).trim();
    const m = s.match(/^(\d{1,2}):(\d{2})/);
    return m ? m[1].padStart(2,'0') + ':' + m[2] : '';
  }

  function parseDay(val) {
    const s = String(val||'').trim();
    const m = s.match(/^(\d{1,2})\//);
    return m ? parseInt(m[1]) : null;
  }

  let added = 0, updated = 0, skippedHol = 0;

  sheetNames.forEach(sheetName => {
    const ws  = wb.Sheets[sheetName];
    const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if (raw.length < 12) return;

    // 月份從列2欄2取得（index: raw[1][2]）
    const rangeCell  = String(raw[1][2] || raw[1][1] || '');
    const rangeMatch = rangeCell.match(/(\d{4})-(\d{2})/);
    if (!rangeMatch) { console.warn('找不到月份：', sheetName); return; }
    const baseYear  = parseInt(rangeMatch[1]);
    const baseMonth = parseInt(rangeMatch[2]);

    // 每人佔 15 欄；姓名在 baseCol+9，上班在 baseCol+1，下班在 baseCol+3
    const PERSON_BLOCK = 15;
    const MAX_PERSONS  = 3;

    for (let pi = 0; pi < MAX_PERSONS; pi++) {
      const baseCol = pi * PERSON_BLOCK;
      if (baseCol >= (raw[2] || []).length) break;

      // 姓名在 baseCol+9（列3，0-based index 2）
      const nameVal = raw[2][baseCol + 9] || '';
      const name    = String(nameVal).trim();
      if (!name || name === '姓名') break;

      let m = members.find(x => x.name.trim() === name);
      if (!m) {
        // 找不到精確比對，再試去除空白後比對
        m = members.find(x => x.name.replace(/\s/g,'') === name.replace(/\s/g,''));
      }
      const empNo = String(raw[3][baseCol + 9] || '').trim(); // 工號（列4）
      if (!m) {
        const dept = String(raw[2][baseCol + 1] || '').trim();
        m = { id:'m'+uid(), name, role: dept || '監造人員', empNo, active:true };
        members.push(m);
      } else if (empNo && !m.empNo) {
        m.empNo = empNo; // 補上既有人員缺少的工號
      }

      // 資料從列12開始（0-based index 11）
      // 日期欄：baseCol+0，上班：baseCol+1，下班：baseCol+3
      for (let ri = 11; ri < raw.length; ri++) {
        const row       = raw[ri];
        const dateLabel = String(row[baseCol] || '').trim();   // e.g. '27/三'
        const day       = parseDay(dateLabel);
        if (!day || day < 1 || day > 31) continue;

        const dateStr = baseYear + '-' +
          String(baseMonth).padStart(2,'0') + '-' +
          String(day).padStart(2,'0');

        const dateObj = new Date(dateStr);
        if (isNaN(dateObj.getTime()) || dateObj.getDate() !== day) continue;

        // 收集當日所有打卡時間（時段一上/下、時段二上/下、加班上/下 共 6 欄）
        // 只取「最早打卡」當上班、「最晚打卡」當下班，不分時段
        const punchOffsets = [1, 3, 6, 8, 10, 12];
        const punches = punchOffsets
          .map(off => parseTimeStr(row[baseCol + off]))
          .filter(Boolean)
          .sort(); // "HH:MM" 字串排序 = 時間先後排序
        const timeIn  = punches.length ? punches[0] : '';
        const timeOut = punches.length > 1 ? punches[punches.length - 1] : '';

        if (!timeIn && !timeOut) continue; // 無打卡記錄跳過

        // 只跳過國定假日；六日加班正常匯入
        if (importHols[dateStr]) { skippedHol++; continue; }

        // 上班超過 08:30 → 自動更正為接近 08:30 但不超過的隨機時間（請款用）
        let adjustedTimeIn = timeIn;
        if (timeIn) {
          const [h, mi2] = timeIn.split(':').map(Number);
          if (h > 8 || (h === 8 && mi2 > 30)) {
            const rnd = 24 + Math.floor(Math.random() * 6); // 08:24 ~ 08:29
            adjustedTimeIn = '08:' + String(rnd).padStart(2, '0');
          }
        }

        const existIdx = attRecords.findIndex(
          r => r.memberId === m.id && r.date === dateStr
        );
        if (existIdx >= 0) {
          attRecords[existIdx].timeIn  = adjustedTimeIn || attRecords[existIdx].timeIn;
          attRecords[existIdx].timeOut = timeOut || attRecords[existIdx].timeOut;
          attRecords[existIdx].status  = 'present';
          attRecords[existIdx].note    = 'XLS匯入';
          updated++;
        } else {
          attRecords.push({
            id: uid(), date: dateStr, memberId: m.id,
            status: 'present', timeIn: adjustedTimeIn, timeOut, note:'XLS匯入',
          });
          added++;
        }
      }
    }
  });

  // 合併重複人員（同名但不同 id 的情況）
  const nameMap = {};
  members.forEach(m => {
    const key = m.name.trim();
    if (!nameMap[key]) {
      nameMap[key] = m;
    } else {
      // 保留先建立的，把後來的 id 的記錄都改成先建立的 id
      const keepId   = nameMap[key].id;
      const removeId = m.id;
      attRecords.forEach(r => { if (r.memberId === removeId) r.memberId = keepId; });
    }
  });
  // 去除重複人員（保留 nameMap 中第一個）
  const keepIds = new Set(Object.values(nameMap).map(m => m.id));
  members = members.filter(m => keepIds.has(m.id));

  attSave(); membersSave();
  alert([
    '✅ 打卡時間匯入完成！',
    `更新：${updated} 筆`,
    skippedHol ? `跳過國定假日：${skippedHol} 筆` : '',
    '',
    '已取當日最早打卡為上班、最晚打卡為下班',
    '上班逾 08:30 已自動修正為 08:30 前',
  ].filter(Boolean).join('\n'));
  renderAll();
}

// ── 模式二：人員排班表（舊格式，無打卡時間）──
function importFromRankingSheet(wb) {
  const ws  = wb.Sheets['人員排班表'];
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
  if (raw.length < 4) { alert('排班表格式不符'); return; }

  const rangeStr   = String(raw[1][1] || '');
  const rangeMatch = rangeStr.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!rangeMatch) { alert('讀不到日期範圍'); return; }
  const baseYear  = parseInt(rangeMatch[1]);
  const baseMonth = parseInt(rangeMatch[2]);
  const headerRow = raw[2];

  const importHols  = (loadHolidays().holidays) || TW_HOLIDAYS_DEFAULT;
  const importWorks = (loadHolidays().workdays) || {};

  function codeToStatus(val) {
    const v = parseFloat(val);
    if (isNaN(v) || v === 0) return null;
    if (v === 25 || v === 26) return 'leave';
    if (v >= 1 && v <= 24)   return 'present';
    return null;
  }

  let added = 0, updated = 0, skipped = 0;

  for (let r = 4; r < raw.length; r++) {
    const row  = raw[r];
    const name = String(row[1] || '').trim();
    if (!name) { skipped++; continue; }

    let m = members.find(x => x.name.trim() === name);
    if (!m) m = members.find(x => x.name.replace(/\s/g,'') === name.replace(/\s/g,''));
    if (!m) {
      const dept = String(row[2] || '').trim();
      m = { id:'m'+uid(), name, role: dept || '監造工程師', active:true };
      members.push(m);
    }

    for (let c = 3; c < row.length; c++) {
      const dayVal = headerRow[c];
      const day    = Math.round(parseFloat(dayVal));
      if (!day || day < 1 || day > 31) continue;

      const dateStr = baseYear + '-' +
        String(baseMonth).padStart(2,'0') + '-' +
        String(day).padStart(2,'0');
      const dateObj = new Date(dateStr);
      if (isNaN(dateObj.getTime()) || dateObj.getDate() !== day) continue;

      const status = codeToStatus(row[c]);
      if (!status) continue;
      if (importHols[dateStr]) continue; // 只跳過國定假日，六日排班保留

      const existIdx = attRecords.findIndex(
        rec => rec.memberId === m.id && rec.date === dateStr
      );
      if (existIdx >= 0) {
        if (attRecords[existIdx].note === 'XLS匯入') {
          attRecords[existIdx].status = status;
          updated++;
        }
      } else {
        attRecords.push({
          id: uid(), date: dateStr, memberId: m.id,
          status, timeIn:'', timeOut:'', note:'XLS匯入',
        });
        added++;
      }
    }
  }

  attSave(); membersSave();
  const peopleCount = raw.length - 4;
  alert([
    '✅ 排班表匯入完成！',
    `人員：${peopleCount} 人`,
    `新增記錄：${added} 筆`,
    `更新記錄：${updated} 筆`,
    skipped ? `略過：${skipped} 列` : '',
    '',
    `月份：${baseYear}年${baseMonth}月（排班表模式，不含打卡時間）`,
  ].filter(Boolean).join('\n'));
  renderAll();
}
init();
</script>
