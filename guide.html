<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送審須知筆記 — 施工及監造回報</title>
<link rel="stylesheet" href="shared.css">
<style>
.gn-toolbar { display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap; }
.gn-search { flex:1;min-width:200px; }
.gn-count { font-size:12.5px;color:var(--text-muted);white-space:nowrap; }

.gn-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;border-top:2px solid var(--dnv-dark-blue);transition:border-color .15s; }
.gn-card:focus-within { border-color:var(--dnv-sea-blue); }
.gn-card-toolbar { display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--border-light); }
.gn-updated { font-size:10.5px;color:var(--text-muted);letter-spacing:.03em; }
.gn-actions { display:flex;gap:6px; }
.gn-icon-btn { width:26px;height:26px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:border-color .12s,color .12s; }
.gn-icon-btn:hover { border-color:var(--dnv-sea-blue);color:var(--dnv-sea-blue); }
.gn-icon-btn.del:hover { border-color:var(--c-red);color:var(--c-red); }
.gn-icon-btn:disabled { opacity:.3;cursor:not-allowed; }

.gn-title-input {
  width:100%;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:17px;font-weight:700;color:var(--text-primary);padding:14px 16px 4px;letter-spacing:.02em;
}
.gn-title-input::placeholder { color:var(--text-muted);font-weight:500; }
.gn-content-input {
  width:100%;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:14px;color:var(--text-secondary);padding:6px 16px 16px;line-height:1.85;
  resize:none;overflow:hidden;min-height:28px;
}
.gn-content-input::placeholder { color:var(--text-muted); }

.gn-empty { text-align:center;padding:70px 20px;color:var(--text-muted);font-size:14.5px;line-height:2; }

@media(max-width:767px) {
  .gn-title-input { font-size:16px;padding:12px 14px 4px; }
  .gn-content-input { padding:4px 14px 14px;font-size:13.5px; }
}
</style>
</head>
<body>
<div id="header-mount"></div>
<div class="layout">
  <div class="sidebar collapsed" id="sidebar">
    <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-inner">
      <div class="sidebar-section-title">快速連結</div>
      <a href="timeline.html" class="btn-secondary" style="text-decoration:none;text-align:center;">← 時間軸</a>
      <a href="doctrack.html" class="btn-secondary" style="text-decoration:none;text-align:center;margin-top:6px;">文件管理 →</a>
    </div>
  </div>
  <div class="main">
    <div class="tab-panel" style="max-width:900px;">
      <div class="page-header">
        <h2>送審須知筆記</h2>
        <button class="btn-primary" style="width:auto;padding:9px 16px;font-size:13.5px;" onclick="addNote()">＋ 新增筆記</button>
      </div>

      <div class="gn-toolbar">
        <input type="search" class="gn-search" placeholder="搜尋筆記標題或內容…" id="gn-search-input" oninput="setGuideSearch(this.value)">
        <span class="gn-count" id="gn-count"></span>
      </div>

      <div id="gn-list"></div>
    </div>
  </div>
</div>
<div class="dnv-brand-footer">DNV AS　減碳A標施工監造回報系統</div>

<div class="toast-confirm" id="toast-confirm">
  <span id="toast-msg">確定要刪除？</span>
  <div style="display:flex;gap:8px;">
    <button class="toast-btn-cancel" onclick="toastResolve(false)">取消</button>
    <button class="toast-btn-ok" id="toast-ok-btn" onclick="toastResolve(true)">刪除</button>
  </div>
</div>

<script src="shared.js"></script>
<script>
'use strict';
if (!requireAuth()) throw new Error('not auth');

let guideNotes = [];
let guideSearchTerm = '';

const guideSave = makeModuleSave(GUIDE_KEY, 'guidenotes', () => guideNotes);

function debounce(fn, ms) {
  let t;
  return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
}
const debouncedSave = debounce(() => guideSave(), 500);

async function init() {
  document.getElementById('header-mount').innerHTML = buildHeader('送審須知筆記');
  initSidebarState();
  renderNav('guide');
  const data = await loadAllData();
  guideNotes = data.guideNotes;
  renderNotes();
}

function fmtUpdated(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch(e) { return iso; }
}

function setGuideSearch(v) { guideSearchTerm = v; renderNotes(); }

function getFilteredNotes() {
  const term = guideSearchTerm.trim().toLowerCase();
  if (!term) return guideNotes;
  return guideNotes.filter(n =>
    (n.title||'').toLowerCase().includes(term) || (n.content||'').toLowerCase().includes(term)
  );
}

function renderNotes() {
  const notes = getFilteredNotes();
  document.getElementById('gn-count').textContent = guideSearchTerm.trim() ? `找到 ${notes.length} / ${guideNotes.length} 則筆記` : `共 ${guideNotes.length} 則筆記`;

  const el = document.getElementById('gn-list');
  if (!guideNotes.length) {
    el.innerHTML = '<div class="gn-empty">還沒有筆記，點右上角「＋ 新增筆記」開始記錄送審相關的重點吧。</div>';
    return;
  }
  if (!notes.length) {
    el.innerHTML = '<div class="gn-empty">沒有符合搜尋的筆記</div>';
    return;
  }

  el.innerHTML = notes.map((n, filteredIdx) => {
    const realIdx = guideNotes.indexOf(n);
    return `<div class="gn-card" data-id="${n.id}">
      <div class="gn-card-toolbar">
        <span class="gn-updated">${n.updatedAt ? '最後編輯 ' + fmtUpdated(n.updatedAt) : ''}</span>
        <div class="gn-actions">
          <button class="gn-icon-btn" onclick="moveNote('${n.id}',-1)" ${realIdx===0?'disabled':''} title="上移">↑</button>
          <button class="gn-icon-btn" onclick="moveNote('${n.id}',1)" ${realIdx===guideNotes.length-1?'disabled':''} title="下移">↓</button>
          <button class="gn-icon-btn del" onclick="deleteNote('${n.id}')" title="刪除">✕</button>
        </div>
      </div>
      <input type="text" class="gn-title-input" placeholder="筆記標題…" value="${esc(n.title)}" oninput="updateNoteField('${n.id}','title',this.value)">
      <textarea class="gn-content-input" placeholder="寫點什麼…" oninput="autoGrow(this);updateNoteField('${n.id}','content',this.value)">${esc(n.content)}</textarea>
    </div>`;
  }).join('');

  // 初始化 textarea 高度
  el.querySelectorAll('.gn-content-input').forEach(autoGrow);
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}

function updateNoteField(id, field, value) {
  const n = guideNotes.find(x => x.id === id);
  if (!n) return;
  n[field] = value;
  n.updatedAt = new Date().toISOString();
  debouncedSave();
}

function addNote() {
  const n = { id: uid(), title: '', content: '', updatedAt: new Date().toISOString() };
  guideNotes.unshift(n);
  guideSave();
  renderNotes();
  const firstInput = document.querySelector('.gn-card .gn-title-input');
  if (firstInput) firstInput.focus();
}

async function deleteNote(id) {
  if (!await toastConfirm('確定要刪除這則筆記？')) return;
  guideNotes = guideNotes.filter(n => n.id !== id);
  guideSave();
  renderNotes();
}

function moveNote(id, dir) {
  const idx = guideNotes.findIndex(n => n.id === id);
  const target = idx + dir;
  if (idx === -1 || target < 0 || target >= guideNotes.length) return;
  const [item] = guideNotes.splice(idx, 1);
  guideNotes.splice(target, 0, item);
  guideSave();
  renderNotes();
}

init().catch(function(e) { if (typeof showErrBanner === 'function') showErrBanner('頁面載入失敗：' + e.message); });
</script>
</body>
</html>
