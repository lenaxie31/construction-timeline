<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>儀表板 — 施工及監造回報</title>
<link rel="stylesheet" href="shared.css">
<style>
.dash-row { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px; }
.dash-box { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px; }
.dash-box h3 { font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px; }
/* 進度 */
.project-progress-card {
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.project-progress-card::before { content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c-green),var(--c-blue),var(--c-amber)); }
.progress-header { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px; }
.progress-header-left h3 { font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:2px; }
.progress-header-left p  { font-size:11px;color:var(--text-muted); }
.progress-pct-display { font-family:'DM Mono',monospace;font-size:32px;font-weight:500;line-height:1;color:var(--c-blue); }
.progress-labels { display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:14px; }
.progress-controls { display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border-light);flex-wrap:wrap; }
.progress-controls label { font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap; }
.progress-slider { flex:1;min-width:120px;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer; }
.progress-slider::-webkit-slider-thumb { -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--dnv-dark-blue);cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2); }
.pct-input { width:56px;font-family:'DM Mono',monospace;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);text-align:center;outline:none; }
/* 狀態 bar */
.multi-bar { height:10px;border-radius:5px;overflow:hidden;display:flex;margin-bottom:8px;background:var(--border-light); }
.multi-seg { height:100%;transition:width .8s cubic-bezier(0.4,0,0.2,1); }
.bar-legend { display:flex;gap:12px;flex-wrap:wrap; }
.bar-leg-item { display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary); }
.bar-leg-dot  { width:8px;height:8px;border-radius:2px; }
/* 近期時間軸 */
.dash-tl-wrap { background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px; }
.dash-tl-header { display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-light);background:var(--bg); }
.dash-tl-header h3 { font-size:13px;font-weight:700;letter-spacing:.04em; }
.dash-tl-inner  { max-height:400px;overflow-y:auto; }
.dash-tl-row    { display:flex;gap:0;border-bottom:1px solid var(--border-light);transition:background var(--transition); }
.dash-tl-row:last-child { border-bottom:none; }
.dash-tl-row:hover { background:#F8F9FF; }
.dash-tl-date   { width:64px;min-width:64px;flex-shrink:0;padding:10px 8px 10px 16px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px; }
.dash-tl-ymd    { font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--dnv-dark-blue); }
.dash-tl-w      { font-size:10px;color:var(--text-muted); }
.dash-tl-sep    { width:1px;background:var(--border-light);flex-shrink:0;margin:8px 0; }
.dash-tl-content{ flex:1;min-width:0;padding:10px 16px 10px 12px;display:flex;flex-direction:column;gap:3px; }
.dash-tl-status { font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;display:inline-block;margin-bottom:4px; }
.dash-tl-text   { font-size:12px;color:var(--text-secondary);line-height:1.55; }
/* open issues */
.mini-issue { padding:10px 12px;border-radius:var(--radius-sm);border-left:3px solid;font-size:12px;line-height:1.5;margin-bottom:8px; }
.mini-issue.open    { background:var(--c-red-bg);border-color:var(--c-red);color:#7f1d1d; }
.mini-issue.pending { background:var(--c-amber-bg);border-color:var(--c-amber);color:#78350f; }
/* schedule */
.schedule-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow);position:relative;overflow:hidden; }
.schedule-card::before { content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c-blue),var(--c-teal)); }
.schedule-grid { display:grid;grid-template-columns:1fr 1fr;gap:20px; }
.schedule-col-title { font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid;display:flex;align-items:center;gap:6px; }
.schedule-col-title.planned { border-color:var(--c-blue);color:var(--c-blue); }
.schedule-col-title.actual  { border-color:var(--c-teal);color:var(--c-teal); }
.sched-row { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
.sched-label { font-size:12px;color:var(--text-secondary);width:52px;flex-shrink:0; }
.sched-bar   { flex:1;height:8px;background:var(--border-light);border-radius:4px;overflow:hidden; }
.sched-fill  { height:100%;border-radius:4px;transition:width .8s cubic-bezier(0.4,0,0.2,1); }
.p1 { background:linear-gradient(90deg,#2563eb,#60a5fa); }
.p2 { background:linear-gradient(90deg,#7c3aed,#a78bfa); }
.pt { background:linear-gradient(90deg,#1e40af,#3b82f6); }
.a1 { background:linear-gradient(90deg,#0d9488,#2dd4bf); }
.a2 { background:linear-gradient(90deg,#0891b2,#22d3ee); }
.at { background:linear-gradient(90deg,#065f46,#10b981); }
.sched-pct-input { width:62px;font-family:'DM Mono',monospace;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);text-align:center;outline:none; }
.sched-deviation { margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);display:flex;gap:20px;flex-wrap:wrap;align-items:center; }
.dev-item { display:flex;align-items:center;gap:6px;font-size:12px; }
.dev-label  { color:var(--text-secondary); }
.dev-value  { font-family:'DM Mono',monospace;font-size:13px;font-weight:700; }
.dev-value.ahead    { color:var(--c-green); }
.dev-value.behind   { color:var(--c-red); }
.dev-value.on-track { color:var(--c-blue); }
@media(max-width:767px) {
  .dash-row { grid-template-columns:1fr;gap:10px; }
  .schedule-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="header-mount"></div>

<div class="layout">
  <div class="sidebar collapsed" id="sidebar">
    <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="收起側欄">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" id="collapse-icon"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-inner">
      <div class="sidebar-section-title">快速連結</div>
      <a href="timeline.html" class="btn-secondary" style="text-decoration:none;text-align:center;">📅 時間軸</a>
      <a href="defects.html" class="btn-secondary" style="text-decoration:none;text-align:center;">📋 改善事項追蹤</a>
      <a href="docs.html"    class="btn-secondary" style="text-decoration:none;text-align:center;">📄 文件送審</a>
      <a href="quality.html" class="btn-secondary" style="text-decoration:none;text-align:center;">🔬 監造查驗</a>
      <a href="export.html"  class="btn-secondary" style="text-decoration:none;text-align:center;">⬇ 匯出報表</a>
    </div>
  </div>

  <div class="main">
    <button class="sidebar-float-btn" id="sidebar-float-btn" onclick="toggleSidebarCollapse()">＋</button>
    <div class="tab-panel" id="panel-dashboard">
      <div id="dash-tl-area"></div>
      <div class="stat-grid" id="stat-grid"></div>

      <!-- 進度條 -->
      <div class="project-progress-card" id="progress-card">
        <div class="progress-header">
          <div class="progress-header-left">
            <h3>整體施工進度（手動設定）</h3>
            <p>拖曳滑桿更新進度百分比</p>
          </div>
          <div class="progress-pct-display" id="progress-pct-display">0%</div>
        </div>
        <div class="progress-track"><div class="progress-fill blue" id="main-progress-fill" style="width:0%"></div></div>
        <div class="progress-labels"><span>0%</span><span>50%</span><span>100%</span></div>
        <div class="progress-controls">
          <label>進度</label>
          <input type="range" class="progress-slider" id="progress-slider" min="0" max="100" value="0" oninput="updateProgress(this.value,true)">
          <input type="number" class="pct-input" id="progress-pct-input" min="0" max="100" value="0" oninput="updateProgress(this.value,true)">
          <span style="font-size:11px;color:var(--text-muted);">%</span>
        </div>
      </div>

      <!-- 預定/實際進度 -->
      <div class="schedule-card">
        <div style="font-size:13px;font-weight:700;margin-bottom:16px;">📊 預定 vs 實際進度對比</div>
        <div class="schedule-grid">
          <div>
            <div class="schedule-col-title planned">📐 預定進度</div>
            <div class="sched-row"><span class="sched-label">合約一</span><div class="sched-bar"><div class="sched-fill p1" id="sp-bar-p1" style="width:0%"></div></div><input class="sched-pct-input" id="sp-p1" type="number" min="0" max="100" placeholder="%" oninput="updateSchedule()"> %</div>
            <div class="sched-row"><span class="sched-label">合約二</span><div class="sched-bar"><div class="sched-fill p2" id="sp-bar-p2" style="width:0%"></div></div><input class="sched-pct-input" id="sp-p2" type="number" min="0" max="100" placeholder="%" oninput="updateSchedule()"> %</div>
            <div class="sched-row"><span class="sched-label">總計</span>  <div class="sched-bar"><div class="sched-fill pt" id="sp-bar-pt" style="width:0%"></div></div><input class="sched-pct-input" id="sp-pt" type="number" min="0" max="100" placeholder="%" oninput="updateSchedule()"> %</div>
          </div>
          <div>
            <div class="schedule-col-title actual">✅ 實際進度</div>
            <div class="sched-row"><span class="sched-label">合約一</span><div class="sched-bar"><div class="sched-fill a1" id="sp-bar-a1" style="width:0%"></div></div><input class="sched-pct-input" id="sp-a1" type="number" min="0" max="100" placeholder="%" oninput="updateSchedule()"> %</div>
            <div class="sched-row"><span class="sched-label">合約二</span><div class="sched-bar"><div class="sched-fill a2" id="sp-bar-a2" style="width:0%"></div></div><input class="sched-pct-input" id="sp-a2" type="number" min="0" max="100" placeholder="%" oninput="updateSchedule()"> %</div>
            <div class="sched-row"><span class="sched-label">總計</span>  <div class="sched-bar"><div class="sched-fill at" id="sp-bar-at" style="width:0%"></div></div><input class="sched-pct-input" id="sp-at" type="number" min="0" max="100" placeholder="%" oninput="updateSchedule()"> %</div>
          </div>
        </div>
        <div class="sched-deviation" id="schedule-deviation"></div>
      </div>

      <div class="dash-row">
        <div class="dash-box">
          <h3>工項狀態分布</h3>
          <div class="multi-bar" id="multi-bar"></div>
          <div class="bar-legend" id="bar-legend"></div>
        </div>
        <div class="dash-box">
          <h3>未結案改善事項</h3>
          <div id="open-defects-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="dnv-brand-footer">DNV AS　減碳A標施工監造回報系統</div>
<div class="toast-confirm" id="toast-confirm">
  <span id="toast-msg">確定？</span>
  <div style="display:flex;gap:8px;">
    <button class="toast-btn-cancel" onclick="toastResolve(false)">取消</button>
    <button class="toast-btn-ok" id="toast-ok-btn" onclick="toastResolve(true)">確定</button>
  </div>
</div>

<script src="shared.js"></script>
<script>
'use strict';
if (!requireAuth()) throw new Error('not auth');

let entries = [], defects = [], docs = [], qualityItems = [];

const STATUS_COLOR = { normal:'#003591', milestone:'#3F9C35', warn:'#E98300', pending:'#E98300', issue:'#EB2A34' };
const STATUS_BG    = { normal:'#EAF3FB', milestone:'#EDF9EC', warn:'#FFF4E0', pending:'#FFF4E0', issue:'#FDE8E9' };
const STATUS_LABEL = { normal:'正常施工', milestone:'里程碑', warn:'待注意', pending:'待決議', issue:'異常／已開單' };

async function init() {
  document.getElementById('header-mount').innerHTML = buildHeader('儀表板');
  initSidebarState();
  renderNav('dashboard');

  const data = await loadAllData();
  entries      = data.entries;
  defects      = data.defects;
  docs         = data.docs;
  qualityItems = data.qualityItems;

  loadScheduleUI();
  const pct = parseInt(localStorage.getItem('construction_progress_v1') || '0') || 0;
  updateProgress(pct, false);
  renderDashboard();
}

function renderDashboard() {
  const today     = todayStr();
  const thisMonth = today.slice(0,7);
  const d0 = new Date(); d0.setDate(1); d0.setMonth(d0.getMonth()-1);
  const lastMonth = d0.getFullYear() + '-' + String(d0.getMonth()+1).padStart(2,'0');

  const st = entries.reduce(function(acc, e) {
    acc.total++;
    if (e.status==='issue')     acc.issues++;
    if (e.status==='pending')   acc.pending++;
    if (e.status==='milestone') acc.milestones++;
    if (e.date.startsWith(thisMonth)) acc.thisMo++;
    return acc;
  }, { total:0, issues:0, pending:0, milestones:0, thisMo:0 });

  const openDef  = defects.filter(d => d.status!=='closed').length;
  const qiTotal  = qualityItems.length;
  const qiDone   = qualityItems.filter(q => q.progress==='Completed').length;
  const qiRate   = qiTotal ? Math.round(qiDone/qiTotal*100)+'%' : '—';

  const sg = document.getElementById('stat-grid');
  if (sg) sg.innerHTML = [
    { cls:'blue',  label:'時間軸記錄',  value:st.total,               sub:'本月 '+st.thisMo+' 筆' },
    { cls:'red',   label:'異常／待決',  value:st.issues+st.pending,   sub:'需關注' },
    { cls:'green', label:'里程碑',      value:st.milestones,          sub:'個' },
    { cls:'amber', label:'未結案通知單',value:openDef,                sub:'張' },
    { cls:'teal',  label:'查驗完成率',  value:qiRate,                 sub:'共 '+qiTotal+' 項' },
    { cls:'',      label:'文件送審中',  value:docs.filter(d=>{ const v=d.versions; return v&&v.length&&v[v.length-1].result==='sent';}).length, sub:'/ '+docs.length+' 份' },
  ].map(s => `<div class="stat-card ${s.cls}"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div><div class="stat-sub">${s.sub}</div></div>`).join('');

  renderMultiBar();
  renderOpenDefects();
  renderDashTimeline();
}

function renderMultiBar() {
  const total = entries.length; if (!total) return;
  const counts = { milestone:0, normal:0, warn:0, pending:0, issue:0 };
  const colors = { milestone:'#16a34a', normal:'#2563eb', warn:'#d97706', pending:'#7c3aed', issue:'#dc2626' };
  const labels = { milestone:'里程碑', normal:'正常施工', warn:'待注意', pending:'待決議', issue:'異常' };
  entries.forEach(e => { if (counts[e.status]!==undefined) counts[e.status]++; });
  const bar = document.getElementById('multi-bar');
  const leg = document.getElementById('bar-legend');
  if (bar) bar.innerHTML = Object.keys(counts).filter(k=>counts[k]>0).map(k =>
    `<div class="multi-seg" style="width:${(counts[k]/total*100).toFixed(1)}%;background:${colors[k]}"></div>`).join('');
  if (leg) leg.innerHTML = Object.keys(counts).filter(k=>counts[k]>0).map(k =>
    `<div class="bar-leg-item"><div class="bar-leg-dot" style="background:${colors[k]}"></div><span>${labels[k]} ${counts[k]}</span></div>`).join('');
}

function renderOpenDefects() {
  const el = document.getElementById('open-defects-list'); if (!el) return;
  const openList = defects.filter(d => d.status!=='closed').slice(0,5);
  const sLabel = { open:'未結案', replied:'已回覆', recheck:'複驗中' };
  el.innerHTML = openList.length
    ? openList.map(d => `<div class="mini-issue ${d.status==='open'?'open':'pending'}">
        <div style="font-size:10px;font-weight:700;margin-bottom:3px;">${esc(d.no||'—')} <span style="font-weight:400;color:var(--text-muted);">${sLabel[d.status]||d.status}</span></div>
        <div>${esc((d.title||'').slice(0,50))}${(d.title||'').length>50?'…':''}</div>
        ${d.deadline?`<div style="font-size:10px;opacity:.7;margin-top:2px;">⏰ ${d.deadline}</div>`:''}
      </div>`).join('')
    : '<div style="font-size:13px;color:var(--text-muted);padding:12px 0;text-align:center">✅ 目前沒有未結案項目</div>';
}

function renderDashTimeline() {
  const area = document.getElementById('dash-tl-area'); if (!area) return;
  const today = todayStr();
  const recent = entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  if (!recent.length) { area.innerHTML=''; return; }

  const rows = recent.map(e => {
    const isToday = e.date===today;
    const sc = STATUS_COLOR[e.status]||'#003591';
    const sb = STATUS_BG[e.status]  ||'#EAF3FB';
    const t1 = e.title ? parseTitle(e.title)[0].split('\n')[0].slice(0,60) : '';
    const s1 = e.sub   ? parseTitle(e.title)[2].split('\n')[0].slice(0,50) || e.sub.slice(0,50) : '';
    return `<div class="dash-tl-row"${isToday?' style="background:#EAF3FB;"':''}>
      <div class="dash-tl-date">
        <div class="dash-tl-ymd">${(e.date||'').slice(5).replace('-','/')}${isToday?'<br><span style="font-size:8px;background:#3F9C35;color:#fff;padding:0 3px;border-radius:2px;">今</span>':''}</div>
        <div class="dash-tl-w">${esc(e.weather||'')}</div>
      </div>
      <div class="dash-tl-sep"></div>
      <div style="width:3px;background:${sc};flex-shrink:0;"></div>
      <div class="dash-tl-content">
        <span class="dash-tl-status" style="background:${sb};color:${sc};">${STATUS_LABEL[e.status]||e.status}</span>
        ${t1?`<div class="dash-tl-text">${esc(t1)}${e.title&&e.title.length>60?'…':''}</div>`:''}
        ${s1?`<div class="dash-tl-text" style="color:var(--c-amber);">${esc(s1)}</div>`:''}
      </div>
    </div>`;
  }).join('');

  area.innerHTML = `<div class="dash-tl-wrap">
    <div class="dash-tl-header">
      <h3>📅 近期施工記錄</h3>
      <a href="timeline.html" class="btn-sm edit" style="text-decoration:none;">查看完整時間軸 →</a>
    </div>
    <div class="dash-tl-inner">${rows}</div>
  </div>`;
}

// ── 整體進度 ──
function updateProgress(val, save) {
  const pct = Math.min(100,Math.max(0,parseInt(val)||0));
  const slider = document.getElementById('progress-slider');
  const input  = document.getElementById('progress-pct-input');
  if (slider) slider.value = pct;
  if (input)  input.value  = pct;
  const fill = document.getElementById('main-progress-fill');
  const disp = document.getElementById('progress-pct-display');
  if (fill) {
    fill.style.width = pct+'%';
    fill.className = 'progress-fill ' + (pct>=80?'green':pct>=40?'blue':'amber');
  }
  if (disp) {
    disp.textContent = pct+'%';
    disp.style.color = pct>=80?'var(--c-green)':pct>=40?'var(--c-blue)':'var(--c-amber)';
  }
  if (save !== false) try { localStorage.setItem('construction_progress_v1', String(pct)); } catch(e) {}
}

// ── 預定/實際進度 ──
function updateSchedule() {
  const fields = ['p1','p2','pt','a1','a2','at'];
  const vals = {};
  fields.forEach(f => { const el=document.getElementById('sp-'+f); vals[f]=el?parseFloat(el.value)||0:0; });
  fields.forEach(f => { const bar=document.getElementById('sp-bar-'+f); if(bar) bar.style.width=Math.min(100,vals[f])+'%'; });
  const devEl = document.getElementById('schedule-deviation');
  if (devEl) {
    const devs = [
      { label:'合約一偏差', val:vals.a1-vals.p1 },
      { label:'合約二偏差', val:vals.a2-vals.p2 },
      { label:'總進度偏差', val:vals.at-vals.pt },
    ];
    devEl.innerHTML = devs.map(d => {
      const cls  = d.val>0.005?'ahead':d.val<-0.005?'behind':'on-track';
      const sign = d.val>0.005?'+':'';
      const lbl  = d.val>0.005?'超前':d.val<-0.005?'落後':'準時';
      return `<div class="dev-item"><span class="dev-label">${d.label}：</span><span class="dev-value ${cls}">${sign}${d.val.toFixed(2)}%（${lbl}）</span></div>`;
    }).join('');
  }
  const saveData = {};
  fields.forEach(f => { const el=document.getElementById('sp-'+f); saveData[f]=el?el.value:''; });
  try { localStorage.setItem('construction_schedule_v1', JSON.stringify(saveData)); } catch(e) {}
}
function loadScheduleUI() {
  try {
    const r = localStorage.getItem('construction_schedule_v1');
    const data = r ? JSON.parse(r) : {};
    ['p1','p2','pt','a1','a2','at'].forEach(f => { const el=document.getElementById('sp-'+f); if(el&&data[f]!==undefined) el.value=data[f]; });
    updateSchedule();
  } catch(e) {}
}

init();
</script>
