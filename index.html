<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — 施工及監造回報 減碳A標</title>
<link rel="stylesheet" href="shared.css">
<style>
body { display:flex;align-items:center;justify-content:center;min-height:100vh; }
.login-wrap {
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:48px 36px;width:360px;text-align:center;box-shadow:var(--shadow-lg);
}
.login-logo {
  width:56px;height:56px;background:var(--dnv-dark-blue);border-radius:14px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
}
.login-logo svg { width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
.login-wrap h1 { font-size:20px;font-weight:700;margin-bottom:4px;color:var(--dnv-dark-blue); }
.login-wrap p  { font-size:13px;color:var(--text-muted);margin-bottom:28px; }
.login-wrap input {
  width:100%;padding:13px 16px;font-family:'DM Mono',monospace;
  font-size:18px;letter-spacing:5px;border:1.5px solid var(--border);
  border-radius:10px;outline:none;text-align:center;
  background:var(--bg);transition:border-color .15s,box-shadow .15s;
}
.login-wrap input:focus { border-color:var(--dnv-dark-blue);box-shadow:0 0 0 3px rgba(15,32,75,0.1);background:#fff; }
.login-wrap input.error { border-color:var(--c-red);background:var(--c-red-bg);animation:shake .3s; }
.login-btn {
  width:100%;margin-top:14px;padding:14px;font-family:inherit;font-size:14px;font-weight:700;
  background:var(--dnv-dark-blue);color:#fff;border:none;border-radius:10px;
  cursor:pointer;transition:opacity .15s,transform .1s;letter-spacing:.5px;
}
.login-btn:hover { opacity:.88;transform:translateY(-1px); }
.login-btn:disabled { opacity:.45;cursor:not-allowed;transform:none; }
.login-err { font-size:12px;color:var(--c-red);margin-top:12px;min-height:18px;font-weight:600; }
.login-footer { margin-top:28px;font-size:11px;color:var(--text-muted); }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h1>施工及監造回報</h1>
  <p>減碳A標　請輸入密碼以繼續</p>
  <input type="password" id="pw-input" placeholder="••••••••" maxlength="32" autocomplete="current-password"
    onkeydown="if(event.key==='Enter')checkPw()">
  <button class="login-btn" id="login-btn" onclick="checkPw()">進入系統</button>
  <div class="login-err" id="pw-err"></div>
  <div class="login-footer">DNV AS　減碳A標施工監造回報系統</div>
</div>

<script src="shared.js"></script>
<script>
'use strict';

// 若已登入直接跳轉
if (isLoggedIn()) {
  window.location.href = 'timeline.html';
}

async function checkPw() {
  const val  = document.getElementById('pw-input').value.trim();
  const inp  = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-err');
  const btn  = document.getElementById('login-btn');
  if (!val) { inp.classList.add('error'); setTimeout(() => inp.classList.remove('error'), 500); return; }
  btn.disabled = true;
  btn.textContent = '驗證中…';
  errEl.textContent = '';
  try {
    const result = await doLogin(val);
    if (result.ok) {
      window.location.href = 'timeline.html';
    } else {
      errEl.textContent = result.error || '密碼錯誤，請再試一次';
      inp.classList.add('error');
      inp.value = '';
      setTimeout(() => inp.classList.remove('error'), 500);
    }
  } catch(e) {
    errEl.textContent = '連線失敗，請確認網路後再試';
  }
  btn.disabled = false;
  btn.textContent = '進入系統';
}
</script>
</body>
</html>
